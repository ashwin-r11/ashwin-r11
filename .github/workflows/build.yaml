name: README build

on:
  push:
    branches:
      - main
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write   # 🔑 allow bot to push commits

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0   # ✅ full history for rebase
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.8
        uses: actions/setup-python@v4
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          pip install python-dateutil requests lxml

      - name: Update README file
        run: python today.py
        env:
          ACCESS_TOKEN: ${{ secrets.GITHUB_TOKEN }}


      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .
          git commit -m "Automated README update" || echo "No changes to commit"

          # ✅ Rebase on latest main, skip conflicts if any
          git fetch origin main
          git rebase origin/main || git rebase --skip

          # ✅ Force push after rebase to avoid non-fast-forward errors
          git push origin main --force
